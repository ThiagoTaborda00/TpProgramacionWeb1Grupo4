<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobFinder - Registrarse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login">
  <main class="caja">
    <h1>Crear cuenta</h1>
    <form action="login.html">
      <label>
        Nombre de usuario
        <input type="text" required placeholder="ej:Juan Perez">
      </label>
      <label >
        Correo electrónico
        <input type="email" required placeholder="ejemplo@gmail.com">
      </label>
      <label>
        Contraseña
        <input type="password" required placeholder="ej:123456">
      </label>
      <label>
        Tipo de cuenta
        <select>
          <option>Usuario</option>
          <option>Administrador</option>
        </select>
      </label>
      <button type="submit">Registrarse</button>
    </form>
    <p>¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
    <p><a href="index.html">Volver al inicio</a></p>
  </main>
</body>
</html>
