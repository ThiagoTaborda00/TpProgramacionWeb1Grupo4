<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobFinder - Acceso de administrador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login">
  <main class="caja">
    <h1>Iniciar sesión</h1>
    <nav class="roles">
      <a href="login.html">Usuario</a>
      <a class="activo" href="login-admin.html">Administrador</a>
    </nav>
    <form action="panel.html">
      <label>
        Usuario o correo electrónico
        <input type="text" required placeholder="ej: admin / admin@email.com">
      </label>
      <label>
        Contraseña
        <input type="password" required placeholder="ej: 123456">
      </label>
      <button type="submit">Ingresar al panel</button>
    </form>
    <p>¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
    <p><a href="index.html">Volver al inicio</a></p>
  </main>
</body>
</html>
